<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rucking 訓練日誌 — 負重進展</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Orbitron:wght@700;900&family=Roboto+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root {
  --primary: #2d5016;
  --accent: #9fef00;
  --accent-bright: #c5ff5c;
  --bg: #0a0e0a;
  --surface: #151a13;
  --surface-el: #1f2619;
  --text: #e8f5e0;
  --muted: #8fa888;
  --border: #2d5016;
  --grid: rgba(159,239,0,0.06);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;overflow-x:hidden;}
body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:repeating-linear-gradient(0deg,transparent,transparent 2px,var(--grid) 2px,var(--grid) 4px),repeating-linear-gradient(90deg,transparent,transparent 2px,var(--grid) 2px,var(--grid) 4px);pointer-events:none;opacity:0.4;z-index:0;}
.wrap{max-width:1400px;margin:0 auto;padding:2rem;position:relative;z-index:1;}
header{margin-bottom:2.5rem;border-bottom:2px solid var(--border);padding-bottom:1.5rem;}
h1{font-family:'Orbitron',sans-serif;font-size:2.5rem;font-weight:900;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.3rem;text-shadow:0 0 20px rgba(159,239,0,.3);}
.subtitle{font-family:'Roboto Mono',monospace;color:var(--muted);font-size:.85rem;letter-spacing:.08em;}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin-bottom:2rem;}
.stat{background:var(--surface);border:1px solid var(--border);padding:1.2rem 1.4rem;position:relative;overflow:hidden;}
.stat::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:linear-gradient(to bottom,var(--accent),var(--accent-bright));opacity:0;transition:opacity .3s;}
.stat:hover::before{opacity:1;}
.stat-lbl{font-family:'Roboto Mono',monospace;font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:.4rem;}
.stat-val{font-family:'Orbitron',sans-serif;font-size:2rem;font-weight:900;color:var(--accent-bright);line-height:1;}
.stat-unit{font-size:.85rem;color:var(--muted);margin-left:.2rem;}

/* filter tabs */
.filter-row{display:flex;gap:.5rem;margin-bottom:1.5rem;flex-wrap:wrap;}
.tab{font-family:'Roboto Mono',monospace;font-size:.75rem;padding:.4rem 1rem;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;text-transform:uppercase;letter-spacing:.06em;transition:all .2s;}
.tab:hover{border-color:var(--accent);color:var(--accent);}
.tab.active{background:var(--primary);border-color:var(--accent);color:var(--accent-bright);}

/* chart sections */
.charts{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-bottom:2rem;}
@media(max-width:900px){.charts{grid-template-columns:1fr;}}
.chart-box{background:var(--surface);border:1px solid var(--border);padding:1.5rem;}
.chart-box.wide{background:var(--surface);border:1px solid var(--border);padding:1.5rem;margin-bottom:2rem;}
.chart-title{font-family:'Orbitron',sans-serif;font-size:.95rem;color:var(--accent);margin-bottom:1.2rem;text-transform:uppercase;letter-spacing:.05em;}
.chart-wrap{position:relative;}

/* legend */
.legend{display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:.8rem;font-family:'Roboto Mono',monospace;font-size:.72rem;color:var(--muted);}
.legend-item{display:flex;align-items:center;gap:.35rem;}
.legend-dot{width:10px;height:10px;border-radius:2px;}

/* table */
.tbl-wrap{background:var(--surface);border:1px solid var(--border);padding:1.5rem;overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:.83rem;}
thead{background:var(--primary);}
th{padding:.7rem .9rem;text-align:left;font-family:'Roboto Mono',monospace;font-size:.7rem;color:var(--accent-bright);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;}
td{padding:.7rem .9rem;border-bottom:1px solid var(--border);color:var(--text);white-space:nowrap;}
tr:hover td{background:var(--surface-el);}
.type-badge{display:inline-block;padding:.2rem .55rem;border-radius:2px;font-family:'Roboto Mono',monospace;font-size:.68rem;font-weight:600;text-transform:uppercase;}
.badge-Rucking{background:rgba(159,239,0,.15);color:#c5ff5c;}
.badge-Hiking{background:rgba(80,200,120,.15);color:#80e0a0;}
.badge-Running{background:rgba(255,160,60,.15);color:#ffb060;}
.badge-Walking{background:rgba(100,180,255,.15);color:#80c8ff;}

footer{text-align:center;padding:2rem 0 1rem;font-family:'Roboto Mono',monospace;font-size:.75rem;color:var(--muted);letter-spacing:.08em;}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>⚡ Rucking Training Log</h1>
  <div class="subtitle" id="subtitle">訓練日誌分析 // Sport10</div>
</header>

<div class="stats" id="statsGrid"></div>

<div class="filter-row" id="filterRow">
  <button class="tab active" data-type="all">全部</button>
  <button class="tab" data-type="Rucking">Rucking</button>
  <button class="tab" data-type="Hiking">Hiking</button>
  <button class="tab" data-type="Running">Running</button>
  <button class="tab" data-type="Walking">Walking</button>
</div>

<div class="charts">
  <div class="chart-box">
    <div class="chart-title">各次訓練負重 (KG)</div>
    <div class="legend" id="legendWeight"></div>
    <div class="chart-wrap"><canvas id="chartWeight" height="220"></canvas></div>
  </div>
  <div class="chart-box">
    <div class="chart-title">各次訓練距離 (KM)</div>
    <div class="legend" id="legendDist"></div>
    <div class="chart-wrap"><canvas id="chartDist" height="220"></canvas></div>
  </div>
</div>

<div class="chart-box wide">
  <div class="chart-title">均速變化 (MIN/KM) <span style="font-size:.7rem;color:var(--muted);font-family:'Roboto Mono',monospace;">— 烘爐地 3/04 (37.1) 已排除</span></div>
  <div class="legend" id="legendPace"></div>
  <div class="chart-wrap"><canvas id="chartPace" height="180"></canvas></div>
</div>

<div class="tbl-wrap">
  <div class="chart-title" style="margin-bottom:1rem;">訓練記錄明細</div>
  <table>
    <thead>
      <tr>
        <th>日期</th>
        <th>類型</th>
        <th>時段</th>
        <th>重量 kg</th>
        <th>距離 km</th>
        <th>爬升 m</th>
        <th>時間</th>
        <th>均速 min/km</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<footer>RUCKING TRAINING LOG // DATA VIA SPORT10</footer>
</div>

<script>
const ALL_DATA = [
  {"date":"2026-07-12","type":"Rucking","season":"夏","period":"日","weight":30,"distance":6.36,"elevation":null,"duration":"1:11:00","pace":11.16,"note":"長靴/氣溫34.5"},
  {"date":"2026-06-01","type":"Rucking","season":"夏","period":"日","weight":11,"distance":6.37,"elevation":30,"duration":"59:24","pace":9.19,"note":"工作靴/長褲"},
  {"date":"2026-05-19","type":"Hiking","season":"春","period":"日","weight":10,"distance":5.3,"elevation":330,"duration":"1:43:59","pace":19.62,"note":"長靴/戰術背心"},
  {"date":"2026-05-18","type":"Hiking","season":"春","period":"日","weight":10,"distance":3.16,"elevation":283,"duration":"1:07:13","pace":21.16,"note":"長靴/戰術背心"},
  {"date":"2026-05-10","type":"Running","season":"春","period":"日","weight":10,"distance":9.0,"elevation":2,"duration":"1:09:00","pace":7.38,"note":"長褲/戰術背心/舒跑杯"},
  {"date":"2026-05-03","type":"Rucking","season":"春","period":"日","weight":11,"distance":6.62,"elevation":24,"duration":"58:58","pace":8.55,"note":"長褲/長靴/前腰包"},
  {"date":"2026-05-02","type":"Rucking","season":"春","period":"日","weight":20,"distance":8.9,"elevation":200,"duration":"2:30:00","pace":16.85,"note":"長褲/長靴/揪團大家一起走"},
  {"date":"2026-03-14","type":"Rucking","season":"春","period":"夜","weight":32,"distance":2.0,"elevation":13,"duration":"23:17","pace":11.38,"note":"農夫走路/手提沙袋16kg*2"},
  {"date":"2026-03-13","type":"Rucking","season":"春","period":"夜","weight":16,"distance":3.2,"elevation":12,"duration":"24:06","pace":7.3,"note":"河濱/牛仔褲/中筒登山靴"},
  {"date":"2026-03-04","type":"Rucking","season":"春","period":"夜","weight":50,"distance":0.25,"elevation":94,"duration":"9:02","pace":37.13,"note":"烘爐地階梯/中筒登山靴/牛仔褲"},
  {"date":"2026-02-24","type":"Rucking","season":"春","period":"夜","weight":5,"distance":3.0,"elevation":3,"duration":"18:23","pace":6.07,"note":"河濱/戰術背心/超快走"},
  {"date":"2026-02-17","type":"Rucking","season":"冬","period":"日","weight":38,"distance":3.0,"elevation":8,"duration":"29:15","pace":9.45,"note":"河濱/單爛包/便鞋"},
  {"date":"2026-02-16","type":"Rucking","season":"冬","period":"日","weight":22,"distance":3.03,"elevation":17,"duration":"32:26","pace":10.4,"note":"河濱/跑鞋/鐵棍掛10+10kg"},
  {"date":"2026-02-15","type":"Rucking","season":"冬","period":"日","weight":32,"distance":3.14,"elevation":16,"duration":"31:05","pace":9.54,"note":"河濱/跑鞋/背20/手提8+4kg"},
  {"date":"2026-02-14","type":"Rucking","season":"冬","period":"日","weight":20,"distance":3.14,"elevation":11,"duration":"30:59","pace":9.51,"note":"河濱/跑鞋/單手提10kg*2"},
  {"date":"2025-12-28","type":"Rucking","season":"冬","period":"日","weight":57,"distance":3.14,"elevation":23,"duration":"34:12","pace":10.53,"note":"河濱/陰雨/便宜背包"},
  {"date":"2025-07-31","type":"Rucking","season":"夏","period":"日","weight":21,"distance":8.65,"elevation":122,"duration":"1:40:11","pace":11.35,"note":"山路/戰術背心/戰術背包/氣溫35"},
  {"date":"2025-07-30","type":"Hiking","season":"夏","period":"日","weight":4,"distance":3.57,"elevation":237,"duration":"49:02","pace":13.43,"note":"山徑/戰術背心"},
  {"date":"2025-07-29","type":"Hiking","season":"夏","period":"日","weight":4,"distance":1.9,"elevation":195,"duration":"28:40","pace":15.05,"note":"山徑/戰術背心"},
  {"date":"2025-07-27","type":"Hiking","season":"夏","period":"日","weight":2,"distance":4.32,"elevation":243,"duration":"50:12","pace":11.37,"note":"山路/戰術背心/中筒越野跑鞋"},
  {"date":"2025-07-25","type":"Running","season":"夏","period":"夜","weight":2,"distance":3.62,"elevation":null,"duration":"20:13","pace":5.35,"note":"大雨/河濱/戰術背心"},
  {"date":"2025-07-24","type":"Rucking","season":"夏","period":"夜","weight":16,"distance":7.53,"elevation":null,"duration":"1:11:56","pace":9.33,"note":"大雨/河濱/戰術背包"},
  {"date":"2025-07-22","type":"Hiking","season":"夏","period":"日","weight":16,"distance":1.2,"elevation":168,"duration":"25:09","pace":20.4,"note":"山路/戰術背包"},
  {"date":"2025-07-22","type":"Hiking","season":"夏","period":"日","weight":16,"distance":1.6,"elevation":118,"duration":"21:30","pace":13.21,"note":"山路/戰術背包"},
  {"date":"2025-07-21","type":"Running","season":"夏","period":"夜","weight":2,"distance":4.07,"elevation":null,"duration":"23:46","pace":5.5,"note":"河濱/戰術背心/碳板跑鞋"},
  {"date":"2025-07-19","type":"Running","season":"夏","period":"夜","weight":6,"distance":4.96,"elevation":null,"duration":"31:25","pace":6.33,"note":"河濱/戰術背心/碳板跑鞋"},
  {"date":"2025-07-16","type":"Rucking","season":"夏","period":"夜","weight":29,"distance":8.34,"elevation":null,"duration":"1:29:00","pace":10.4,"note":"河濱/老舊登山背包"},
  {"date":"2025-07-13","type":"Walking","season":"夏","period":"日","weight":6,"distance":13.15,"elevation":null,"duration":"1:51:00","pace":8.26,"note":"市區/河濱/休閒背包"},
  {"date":"2025-07-09","type":"Running","season":"夏","period":"夜","weight":4,"distance":6.25,"elevation":null,"duration":"37:00","pace":5.55,"note":"河濱/戰術背心/碳版跑鞋"},
  {"date":"2025-07-06","type":"Rucking","season":"夏","period":"日","weight":16,"distance":10.0,"elevation":null,"duration":"1:17:00","pace":7.42,"note":"河濱/便宜背包/中筒越野跑鞋"},
  {"date":"2025-02-16","type":"Rucking","season":"冬","period":"夜","weight":23,"distance":3.2,"elevation":null,"duration":"24:00","pace":7.3,"note":"河濱/便宜背包/訓練鞋"}
];

const TYPE_COLORS = {
  Rucking: '#9fef00',
  Hiking:  '#50c878',
  Running: '#ff9030',
  Walking: '#60b8ff'
};

let activeType = 'all';
let charts = {};

function filtered() {
  return activeType === 'all' ? ALL_DATA : ALL_DATA.filter(d => d.type === activeType);
}

function fmt(v, dec=1) { return v == null ? '—' : (+v).toFixed(dec); }

function buildStats(data) {
  const totalDist = data.reduce((s,d) => s + d.distance, 0);
  const maxW = Math.max(...data.map(d => d.weight));
  const avgW = data.reduce((s,d) => s + d.weight, 0) / data.length;
  const totalElev = data.filter(d => d.elevation).reduce((s,d) => s + d.elevation, 0);
  const earliest = data[data.length-1].date;
  const latest = data[0].date;

  document.getElementById('subtitle').textContent =
    `訓練日誌分析 // Sport10  •  ${earliest} — ${latest}  |  ${data.length} 筆記錄`;

  const defs = [
    {lbl:'記錄筆數', val:data.length, unit:'筆'},
    {lbl:'總累積距離', val:fmt(totalDist), unit:'km'},
    {lbl:'最高負重', val:maxW, unit:'kg'},
    {lbl:'平均負重', val:fmt(avgW), unit:'kg'},
    {lbl:'總爬升', val:Math.round(totalElev), unit:'m'},
  ];
  const g = document.getElementById('statsGrid');
  g.innerHTML = '';
  defs.forEach(s => {
    g.innerHTML += `<div class="stat"><div class="stat-lbl">${s.lbl}</div><div class="stat-val">${s.val}<span class="stat-unit">${s.unit}</span></div></div>`;
  });
}

function makeLegend(id) {
  const el = document.getElementById(id);
  el.innerHTML = Object.entries(TYPE_COLORS).map(([t,c]) =>
    `<span class="legend-item"><span class="legend-dot" style="background:${c}"></span>${t}</span>`
  ).join('');
}

function pointColors(data) {
  return data.map(d => TYPE_COLORS[d.type] || '#9fef00');
}

function buildCharts(data) {
  const labels = data.map(d => d.date.slice(5)); // MM-DD
  const colors = pointColors(data);

  const baseOpts = {
    responsive: true,
    maintainAspectRatio: false,
    plugins: { legend: { display: false }, tooltip: {
      backgroundColor:'#1f2619', borderColor:'#2d5016', borderWidth:1,
      titleColor:'#c5ff5c', bodyColor:'#e8f5e0',
      callbacks: { title: (items) => data[items[0].dataIndex].date }
    }},
    scales: {
      x: { ticks: { color:'#8fa888', font:{family:'Roboto Mono',size:10}, maxRotation:45, autoSkip:true, maxTicksLimit:16 }, grid:{color:'rgba(45,80,22,.4)'} },
      y: { ticks: { color:'#8fa888', font:{family:'Roboto Mono',size:10} }, grid:{color:'rgba(45,80,22,.4)'} }
    }
  };

  // Weight chart
  if (charts.weight) charts.weight.destroy();
  charts.weight = new Chart(document.getElementById('chartWeight'), {
    type:'bar',
    data:{ labels, datasets:[{ data: data.map(d=>d.weight), backgroundColor: colors, borderRadius:2 }] },
    options:{ ...baseOpts, plugins:{...baseOpts.plugins}, scales:{...baseOpts.scales, y:{...baseOpts.scales.y, beginAtZero:true, title:{display:true,text:'kg',color:'#8fa888',font:{size:10}}}}}
  });

  // Distance chart
  if (charts.dist) charts.dist.destroy();
  charts.dist = new Chart(document.getElementById('chartDist'), {
    type:'bar',
    data:{ labels, datasets:[{ data: data.map(d=>d.distance), backgroundColor: colors, borderRadius:2 }] },
    options:{ ...baseOpts, scales:{...baseOpts.scales, y:{...baseOpts.scales.y, beginAtZero:true, title:{display:true,text:'km',color:'#8fa888',font:{size:10}}}}}
  });

  // Pace chart — exclude outlier (烘爐地 37.13)
  const paceData = data.filter(d => d.pace < 30);
  const paceLabels = paceData.map(d => d.date.slice(5));
  const paceColors = pointColors(paceData);

  if (charts.pace) charts.pace.destroy();
  charts.pace = new Chart(document.getElementById('chartPace'), {
    type:'line',
    data:{ labels: paceLabels, datasets:[{
      data: paceData.map(d=>d.pace),
      borderColor:'#9fef00', borderWidth:2,
      pointBackgroundColor: paceColors,
      pointBorderColor:'#0a0e0a', pointBorderWidth:1.5,
      pointRadius:5, pointHoverRadius:7,
      tension:0.3, fill:false
    }]},
    options:{ ...baseOpts,
      plugins:{...baseOpts.plugins, tooltip:{...baseOpts.plugins.tooltip,
        callbacks:{ title:(items)=>paceData[items[0].dataIndex].date,
          afterLabel:(item)=> paceData[item.dataIndex].note }}},
      scales:{...baseOpts.scales, y:{...baseOpts.scales.y, reverse:false, title:{display:true,text:'min/km',color:'#8fa888',font:{size:10}}}}
    }
  });
}

function buildTable(data) {
  const tb = document.getElementById('tableBody');
  tb.innerHTML = data.map(d => `
    <tr>
      <td>${d.date}</td>
      <td><span class="type-badge badge-${d.type}">${d.type}</span></td>
      <td>${d.period}</td>
      <td>${d.weight}</td>
      <td>${d.distance}</td>
      <td>${d.elevation != null ? d.elevation : '—'}</td>
      <td style="font-family:'Roboto Mono',monospace">${d.duration}</td>
      <td style="font-family:'Roboto Mono',monospace">${d.pace}</td>
    </tr>`).join('');
}

function render() {
  const data = filtered();
  buildStats(data);
  buildCharts(data);
  buildTable(data);
}

// filter tabs
document.getElementById('filterRow').addEventListener('click', e => {
  if (!e.target.dataset.type) return;
  activeType = e.target.dataset.type;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.type === activeType));
  render();
});

makeLegend('legendWeight');
makeLegend('legendDist');
makeLegend('legendPace');
render();
</script>
</body>
</html>
